# Builds the documentation and publishes it on GitHub Pages.
#
# The site lands at https://emin-girimhanov.github.io/oscar-discord-bot/. Pages has to be
# set to "GitHub Actions" as its source, under Settings -> Pages.

name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a newer push does not cancel a running one halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install the project
        # mkdocstrings imports the source to read the docstrings, so the project
        # itself has to be installed, not only the docs extras.
        run: pip install .[docs]
      - name: Build the documentation
        run: mkdocs build --strict --site-dir site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
